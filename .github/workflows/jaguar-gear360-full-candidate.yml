name: JAGUAR GEAR360 full Explorer candidate guard
on:
  push:
    branches: [jaguar/gear360-full-explorer-candidate-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-explorer-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard the complete Explorer modules and WHY pedagogy
        run: node scripts/jaguar-gear360-full-candidate-gate.cjs
      - name: Exercise canonical WHY S3 assessment
        run: node scripts/test-s3-why-canonical-green-cycle.js
      - name: Guard S3 language re-entry
        run: node scripts/test-why-s3-language-reentry.cjs
      - name: Guard S1-S4 WHY presentation
        run: node scripts/test-why-explorer-s1-s4-presentation.cjs
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke on complete Explorer without NICK
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gear360-server.log 2>&1 &
          node scripts/jaguar-gear360-full-browser-smoke.cjs
      - name: Install Chromium for full Explorer smoke
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate full Explorer without NICK in real browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/siyayo-http.log 2>&1 &
          node scripts/jaguar-gear360-full-browser-smoke.cjs
