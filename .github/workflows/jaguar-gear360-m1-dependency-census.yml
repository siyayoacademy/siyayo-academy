name: JAGUAR M1 selective integration dependency census
on:
  push:
    branches: [jaguar/gear360-main-integration-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-source-to-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: jaguar/why-explorer-live-wire-20261029
          path: why-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert source files and report missing target dependencies
        run: node integration/scripts/jaguar-gear360-m1-dependency-census.cjs baseline why-source
      - name: Verify recovered WHY modules integrity and source script order
        run: node integration/scripts/jaguar-gear360-m14-why-integrity.cjs why-source integration
      - name: Audit GEAR DOM CSS and source-loader integration gap
        run: node integration/scripts/jaguar-gear360-m15-dom-css-gate.cjs baseline why-source integration
      - name: Verify no-NICK WHY pedagogical bridge M1.8
        working-directory: integration
        run: node scripts/jaguar-gear360-m18-pedagogical-bridge.cjs
      - name: Execute no-NICK WHY render over twelve combinations
        working-directory: integration
        run: node scripts/jaguar-gear360-m19-runtime-render.cjs
      - name: Install browser test runner
        working-directory: integration
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real Chromium S1-S4 x EN/ES/PT no-NICK smoke
        working-directory: integration
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/siyayo-http.log 2>&1 &
          node scripts/jaguar-gear360-m112-browser-smoke.cjs
