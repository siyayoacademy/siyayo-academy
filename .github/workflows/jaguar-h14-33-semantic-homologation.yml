name: JAGUAR H14.33 semantic homologation reference
on:
  push:
    branches: [jaguar/h14-33-why-semantic-homologation-reference]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  reference-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-33-homologation-reference.js
          node scripts/test-jaguar-h14-32-pedagogical-mediation.js
          node scripts/test-jaguar-h14-31-two-reviewer-consistency.js
          node scripts/test-s3-why-canonical-green-cycle.js
      - run: node scripts/jaguar-h14-33-homologation-reference-audit.js --json > h14-33-reference-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: jaguar-h14-33-reference-readiness
          path: h14-33-reference-readiness.json
