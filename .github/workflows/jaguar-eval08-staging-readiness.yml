name: EVAL-08 Cloudflare staging readiness (NO DEPLOY)
on:
  push:
    branches: [jaguar/eval08-staging-readiness-20261027]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/test-eval08-staging-readiness.mjs
      - run: node labs/jaguar-v30-3/scripts/cloudflare-proof-preflight.mjs
      - run: node labs/jaguar-v30-3/scripts/check-staging-architecture-89d.mjs
      - run: node --test scripts/test-eval08-canonical-readback-projection.mjs
      - run: node --test scripts/test-eval08-atomic-readback.mjs
