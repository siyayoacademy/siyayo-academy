name: JAGUAR H14.37 WHY trilingual semantic parity
on:
  push:
    branches: [jaguar/h14-37-why-trilingual-semantic-parity]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trilingual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-37-trilingual-semantic-review.js
          node scripts/test-jaguar-h14-36-phase1-source-review.js
          node scripts/test-jaguar-h14-35-progressive-homologation.js
          node scripts/test-s3-why-canonical-green-cycle.js
      - run: node scripts/jaguar-h14-37-trilingual-semantic-review.js --json > h14-37-trilingual-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: jaguar-h14-37-trilingual-semantic-packets
          path: h14-37-trilingual-review.json
