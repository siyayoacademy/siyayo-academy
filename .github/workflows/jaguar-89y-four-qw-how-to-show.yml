name: JAGUAR 89Y four QWs integrated HOW TO SHOW
on:
  push:
    branches: [jaguar/verb-explorer-how-to-show-89y]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Canonical assessment and memory regressions
        run: |
          node --check js/verb-explorer-what-assessment-live.js
          node --check js/verb-explorer-where-assessment-live.js
          node --check js/verb-explorer-why-assessment-live.js
          node scripts/test-where-live-assessment.js
          node scripts/test-s1-what-canonical-green-cycle.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-jaguar-review-after-contextual-feedback.js
          node scripts/test-elo7d1-polyglot-word-path-view.js
          node scripts/test-elo7d2-word-path-evidence-detail.js
      - name: Prepare local real Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/89y-server.log" 2>&1 &
          sleep 3
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: WHERE WHAT strict original 89X.2
        run: python scripts/experimental-89x-how-to-show.py
      - name: Four QWs S1 WHICH WHAT WHERE plus Trail and Word Path
        run: python scripts/experimental-89y-four-qw-integrated.py
      - name: WHY S3 S4 transfer and native browser visual/audio isolation
        run: python scripts/experimental-89u-why-how-to-show.py
      - name: Preserve screenshots for human comparison and reports even on RED
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-89y-four-qw-homologation-evidence
          path: |
            visual-audit-89y/
            visual-audit-89w/
            visual-audit-89u/
          retention-days: 14
          if-no-files-found: warn
