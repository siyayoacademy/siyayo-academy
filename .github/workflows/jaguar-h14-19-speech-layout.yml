name: JAGUAR H14.19 speech layout and period gap
on:
  push:
    branches: [jaguar/h14-19-func13-speech-window-period-gap]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-19-speech-layout.js
          node scripts/test-jaguar-h14-18-function-window.js
          node scripts/test-jaguar-h14-15-func13-unified.js
          node scripts/test-s3-why-canonical-green-cycle.js
