name: JAGUAR 90C.7H.2 multilingual WHY retained resume
on:
  push:
    branches: [jaguar/explorer-why-language-resume-90c7h2]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node --check js/verb-explorer.js
          node --check js/verb-explorer-thinking-mind-assessment-selection.js
          node scripts/test-jaguar-why-90c7h1-dependency.js
          node scripts/jaguar-90c7h0-supervisor.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-jaguar-why-present-exploration-90c6.js
          node scripts/test-which-third-attempt-green-boundary-90b1.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - run: python scripts/experimental-90c7h2-multilingual-why-resume.py
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c7h2-multilingual-why
          path: visual-audit-90c7h2/
          retention-days: 30
