name: JAGUAR H14.55 integration handoff integrity
on:
  push:
    branches: [jaguar/h14-55-pre-func13-integration-handoff-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Audit 53 steps and all source blobs
        run: node scripts/test-jaguar-h14-55-integration-handoff.cjs
      - name: Verify Master VIP & FUNC-13 contracts
        run: |
          node scripts/test-jaguar-h14-13-progressive-integration.js
          node scripts/test-jaguar-h14-23-gear-snapshot.js
      - name: Verify H14.43 integration freeze (no product approval)
        run: node scripts/test-jaguar-h14-43-integration-readiness.js
