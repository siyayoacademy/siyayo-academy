name: JAGUAR 90C.7H.0 supervisor baseline
on:
  push:
    branches: [jaguar/explorer-supervision-gate-90c7h0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Baseline and historic authority
        run: |
          node scripts/jaguar-90c7h0-supervisor.js
          node scripts/test-jaguar-why-present-exploration-90c6.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-which-third-attempt-green-boundary-90b1.js
          node scripts/test-jaguar-lines-authority-90c4.js
          node scripts/test-jaguar-retro-coherence-90c3.js
          test "$(git rev-parse HEAD:labs/jaguar-v30-3)" = "5ee77257551593b8e4960dd6971cc7ed069fcd56"
      - name: Publish supervision matrix including known gaps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c7h0-supervision-matrix
          path: visual-audit-90c7h0/
          if-no-files-found: warn
          retention-days: 30
  switch-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Isolated browser start
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/90c7h0-http.log" 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: Real Chromium WHICH S1 to WHY S3 transition EN ES PT
        run: python scripts/experimental-90c7h0-which-to-why-portrait.py
      - name: Retain actual captures and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c7h0-which-to-why
          path: visual-audit-90c7h0-switch/
          retention-days: 30
          if-no-files-found: warn
