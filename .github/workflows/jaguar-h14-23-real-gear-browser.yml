name: JAGUAR H14.23 Gear Snapshot real browser gate
on:
  push:
    branches: [jaguar/h14-23-func13-real-gear-readonly-integration]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  read-only-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: node scripts/test-jaguar-h14-23-gear-snapshot.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-jaguar-h14-23-real-gear-browser.cjs
