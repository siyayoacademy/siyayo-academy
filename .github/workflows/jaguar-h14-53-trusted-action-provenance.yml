name: JAGUAR H14.53 trusted action provenance lab
on:
  push:
    branches: [jaguar/h14-53-why-trusted-provenance-worker]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-isolated-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix labs/jaguar-v30-3/test/h14-53 --no-audit --no-fund
      - run: npm ci --prefix labs/jaguar-v30-3/test/h14-52 --no-audit --no-fund
      - run: |
          npm test --prefix labs/jaguar-v30-3/test/h14-53
          npm test --prefix labs/jaguar-v30-3/test/h14-52
          node --test labs/jaguar-v30-3/test/h14-50/guarded-batch-candidate.test.mjs
          node --test labs/jaguar-v30-3/test/h14-44/server-binding-dry-run.test.mjs
          node --test labs/jaguar-v30-3/test/storage-contract.test.mjs
          node scripts/test-s3-why-canonical-green-cycle.js
