# JAGUAR 90B.1: audit both preserved lines; no production/D1/Access, portrait-only captures.
name: JAGUAR 90B.1 V30+89Z integrated audit
on:
  push:
    branches: [jaguar/explorer-integration-gate-90b1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Preserve original V30 tree and all 12 BLOCKED gates
        run: |
          test "$(git rev-parse HEAD:labs/jaguar-v30-3)" = "5ee77257551593b8e4960dd6971cc7ed069fcd56"
          node scripts/check-jaguar-90a-manifest.mjs
          node scripts/check-jaguar-90b-roadmap.mjs
          node scripts/check-jaguar-90b1-audit.mjs
      - uses: actions/checkout@v5
        with:
          repository: siyayoacademy/siyayo-academy
          ref: c7e83709cacf8479847df0f3cee4ed8a563aaae6
          path: .pinned-explorer-90b1
      - name: Historical identity, restore and security simulation
        env:
          SIYAYO_89Q_PINNED_ROOT: ../../.pinned-explorer-90b1
          SIYAYO_89R_PINNED_ROOT: ../../.pinned-explorer-90b1
        working-directory: labs/jaguar-v30-3
        run: |
          node --test test/worker.test.mjs test/identity-mock/identity.test.mjs test/bridge.test.mjs test/worker-v30-integration.test.mjs
          node --test test/scoped-memory-continuity-89q.test.mjs test/scoped-selection-word-path-89r.test.mjs
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Four canonical QW contracts, origin, support, identity and Trail
        run: |
          # Historical WHICH first-attempt test expects unscoped USE (no mode).
          # The current contract deliberately requires mode:local. Preserve the
          # historical test in Git, but gate the current evaluator on modern
          # LIVE/UI and the already-proven pinned V30 89P mode boundary.
          node scripts/test-verb-explorer-determiner-use-assessment-live.js
          node scripts/test-which-third-attempt-green-boundary.js
          node scripts/test-s1-what-canonical-green-cycle.js
          node scripts/test-s2-what-canonical-green-cycle.js
          node scripts/test-s2-what-longitudinal-transfer.js
          node scripts/test-where-location-pass-contract.js
          node scripts/test-where-live-assessment.js
          node scripts/test-where-authority-admission.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-s3-why-transfer-authority.js
          node scripts/test-jaguar-review-after-contextual-feedback.js
          node scripts/test-assessment-language-isolation.js
          node scripts/test-choice-occurrence-identity.js
          node scripts/test-verb-explorer-learner-identity-source.js
          node scripts/test-verb-explorer-live-next-wire.js
          node scripts/test-verb-explorer-toro-presentation-memory.js
          node scripts/test-verb-explorer-learner-trail-surface.js
          node scripts/test-elo7d1-polyglot-word-path-view.js
          node scripts/test-elo7d2-word-path-evidence-detail.js
          node scripts/test-pronoun-contrast-89z.js
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Start isolated Chrome test origin, never Cloudflare
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/90b1-server.log" 2>&1 &
          sleep 3
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: S1 WHICH WHAT WHERE plus Trail Word Path, EN ES PT PORTRAIT
        run: python scripts/experimental-90b1-four-qw-portrait.py
      - name: S3 WHY S4 transfer and speaker isolation, EN ES PT PORTRAIT
        run: python scripts/experimental-90b1-why-portrait.py
      - name: ES/PT singular plural free practice PORTRAIT
        run: python scripts/experimental-89z-portrait.py
      - name: Preserve only portrait screenshots and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90b1-cross-lineage-portrait
          path: |
            visual-audit-90b1-qw/
            visual-audit-90b1-why/
            visual-audit-89z/
          if-no-files-found: warn
          retention-days: 14
