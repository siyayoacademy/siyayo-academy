name: JAGUAR H14.61 isolated trusted referral preflight
on:
  push:
    branches: [jaguar/h14-61-trusted-referral-preflight-20261026]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test labs/jaguar-v30-3/test/h14-61/referral-preflight.test.mjs
      - run: |
          node scripts/test-jaguar-h14-60-referral.cjs
          node scripts/test-jaguar-h14-59-scoped-applicability.cjs
          node scripts/test-jaguar-h14-58-authority-review.cjs
          node scripts/test-jaguar-h14-57-opportunity-bridge.cjs
          node scripts/test-question-word-assessment-contract.js
