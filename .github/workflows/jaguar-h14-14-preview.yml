name: JAGUAR H14.14 opt-in visual integrity
on:
  push:
    branches: [jaguar/h14-14-specialized-preview-default-off]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-12-integration-temporal.js
          node scripts/test-jaguar-h14-13-progressive-integration.js
          node scripts/test-jaguar-h14-14-preview.js
          node scripts/test-s3-why-canonical-green-cycle.js
