name: JAGUAR H14.3 WHY S1 eligibility (reference only)
on:
  push:
    branches: [jaguar/patita-h14-3-why-s1-context-eligibility]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  reference-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-2-opportunity-map.js
          node scripts/test-jaguar-h14-3-why-s1-eligibility.js
          node scripts/test-s3-why-canonical-green-cycle.js
