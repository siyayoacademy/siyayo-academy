name: JAGUAR H14.9 semantic 80 crossing study
on:
  push:
    branches: [jaguar/h14-9-semantic-80-relations-audit]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  semantic-study-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-7-five-functions-matrix.js
          node scripts/test-jaguar-h14-7-existence-lab.js
          node --check scripts/jaguar-h14-8-perspective-cross-reference.js
          node scripts/test-jaguar-h14-8-perspective-cross-reference.js
          node scripts/test-jaguar-h14-9-semantic-80-review.js
          node scripts/test-jaguar-h14-6-why-origin-scoped-contract.js
          node scripts/test-s3-why-canonical-green-cycle.js
