name: JAGUAR 89X HOW TO SHOW semantic geometry
on:
  push:
    branches: [jaguar/verb-explorer-how-to-show-89x]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Canonical regressions before HOW TO SHOW
        run: |
          node --check js/verb-explorer-what-assessment-live.js
          node --check js/verb-explorer-where-assessment-live.js
          node --check js/verb-explorer-why-assessment-live.js
          node scripts/test-where-live-assessment.js
          node scripts/test-s1-what-canonical-green-cycle.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-elo7d1-polyglot-word-path-view.js
          node scripts/test-elo7d2-word-path-evidence-detail.js
      - name: Real browser, responsive geometry and evidence
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/89x-server.log" 2>&1 &
          sleep 3
          python scripts/experimental-89x-how-to-show.py
      - name: Preserve proof even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-89x-full-width-questions-responses
          path: visual-audit-89w/
          if-no-files-found: warn
          retention-days: 14
