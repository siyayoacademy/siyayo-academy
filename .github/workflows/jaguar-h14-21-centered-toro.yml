name: JAGUAR H14.21 centered Toro FUNC-13
on:
  push:
    branches: [jaguar/h14-21-func13-centered-toro-presentation]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  centralization-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-21-centered-toro.js
          node scripts/test-jaguar-h14-20-corpus-speech-card.js
          node scripts/test-jaguar-h14-18-function-window.js
          node scripts/test-jaguar-h14-15-func13-unified.js
