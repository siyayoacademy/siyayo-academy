name: JAGUAR 90C.4 logic and HOW TO SHOW authority guard
on:
  push:
    branches: [jaguar/explorer-how-to-show-authority-90c4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-false-credit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Authority presentation, historical contracts and release blockers
        run: |
          test "$(git rev-parse HEAD:labs/jaguar-v30-3)" = "5ee77257551593b8e4960dd6971cc7ed069fcd56"
          node --check js/verb-explorer-visible-assessment-boundary.js
          node --check js/verb-explorer.js
          node scripts/test-jaguar-lines-authority-90c4.js
          node scripts/test-jaguar-contextual-coherence-90c2.js
          node scripts/test-jaguar-retro-coherence-90c3.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-where-live-assessment.js
          node scripts/check-jaguar-90a-manifest.mjs
          node scripts/check-jaguar-90b-roadmap.mjs
          node scripts/check-jaguar-90b1-audit.mjs
  portrait-why-independent-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Prepare offline static Chrome test
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/90c4-http.log" 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: Preserve WHAT while selecting WHY at S3, no LINES audio credit
        run: python scripts/experimental-90c4-independent-why-entry-portrait.py
      - name: Save EN ES PT screenshots and negative outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c4-independent-why-entry-portrait
          path: visual-audit-90c4/
          retention-days: 30
          if-no-files-found: warn
