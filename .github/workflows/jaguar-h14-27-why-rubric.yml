name: JAGUAR H14.27 WHY function recognition semantic rubric
on:
  push:
    branches: [jaguar/h14-27-why-causal-function-semantic-rubric]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  why-rubric-and-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-27-why-semantic-rubric.js
          node scripts/test-jaguar-h14-26-why-independent-task-blueprints.js
          node scripts/test-jaguar-h14-25-why-s1-s2-fine-review.js
          node scripts/test-s3-why-canonical-green-cycle.js
