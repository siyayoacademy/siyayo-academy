name: Verb Explorer Adaptive Bootstrap

on:
  pull_request:
    paths:
      - 'js/**'
      - 'scripts/test-*.js'
      - '.github/workflows/verb-explorer-adaptive-bootstrap.yml'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check adaptive JavaScript
        run: |
          find js -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -maxdepth 1 -type f -name 'test-*.js' -print0 | xargs -0 -n1 node --check
      - name: Test adaptive session transition boundary
        run: node scripts/test-adaptive-session-transition-boundary.js
      - name: Test adaptive candidate grounding
        run: node scripts/test-adaptive-progression-eligibility.js
      - name: Test adaptive pedagogical state observation
        run: node scripts/test-adaptive-pedagogical-completion.js
      - name: Test adaptive convergence resolver
        run: node scripts/test-adaptive-convergence-resolver.js
      - name: Test browser bootstrap
        run: node scripts/test-verb-explorer-adaptive-bootstrap.js
      - name: Test browser bootstrap convergence dependency order
        run: node scripts/test-verb-explorer-adaptive-bootstrap-convergence-order.js
      - name: Test canonical Skill definition loader
        run: node scripts/test-verb-explorer-canonical-skill-loader.js
      - name: Test explicit learner identity provider
        run: node scripts/test-verb-explorer-learner-identity-provider.js
      - name: Test Leaf assessment target authority
        run: node scripts/test-leaf-assessment-target-authority.js
      - name: Test Leaf assessment target readiness
        run: node scripts/test-leaf-assessment-target-readiness.js
      - name: Test canonical Leaf assessment target provider
        run: node scripts/test-leaf-assessment-target-provider.js
      - name: Test Story assessment Leaf contract
        run: node scripts/test-story-assessment-leaf.js
      - name: Test Story assessment Leaf Smart Slide propagation
        run: node scripts/test-story-assessment-leaf-slide-propagation.js
      - name: Test human Story assessment Leaf selection
        run: node scripts/test-story-assessment-leaf-selection.js

      - name: Test explicit Story semantic surface
        run: node scripts/test-story-semantic-surface.js

      - name: Test Story Assessment Leaf semantic surface binding
        run: node scripts/test-story-assessment-leaf-surface.js

      - name: Test Story semantic surface Smart Slide propagation
        run: node scripts/test-story-semantic-surface-slide-propagation.js

      - name: Test Story semantic surface language realization
        run: node scripts/test-story-semantic-surface-realization.js

      - name: Test Story semantic surface DOM materialization
