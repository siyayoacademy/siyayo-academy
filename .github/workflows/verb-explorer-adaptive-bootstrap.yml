        run: node scripts/test-adaptive-convergence-resolver.js
      - name: Test explicit learner progression decision
        run: node scripts/test-adaptive-progression-decision.js
      - name: Test Coordinator progression transition bridge
        run: node scripts/test-verb-explorer-progression-transition.js
      - name: Test browser bootstrap
