name: Verb Explorer Adaptive Bootstrap

on:
  pull_request:
    paths:
      - 'js/adaptive-browser-runtime.js'
      - 'js/verb-explorer-adaptive-bootstrap.js'
      - 'js/verb-explorer-cycle-resume-dispatch.js'
      - 'js/green-pass-authority-policy.js'
      - 'js/verb-explorer-learner-event.js'
      - 'js/verb-explorer-adaptive-controller.js'
      - 'js/verb-explorer-choice-adaptive-wire.js'
      - 'js/verb-explorer-adaptive-input-provider.js'
      - 'scripts/test-verb-explorer-adaptive-bootstrap.js'
      - 'scripts/test-verb-explorer-learner-event.js'
      - 'scripts/test-verb-explorer-learner-event-agency.js'
      - 'scripts/test-verb-explorer-adaptive-controller.js'
      - 'scripts/test-verb-explorer-adaptive-input-provider.js'
      - 'scripts/test-verb-explorer-choice-adaptive-integration.js'
      - '.github/workflows/verb-explorer-adaptive-bootstrap.yml'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check js/adaptive-browser-runtime.js
          node --check js/verb-explorer-adaptive-bootstrap.js
          node --check js/verb-explorer-cycle-resume-dispatch.js
          node --check js/verb-explorer-learner-event.js
          node --check js/verb-explorer-adaptive-controller.js
          node --check js/verb-explorer-choice-adaptive-wire.js
          node --check js/verb-explorer-adaptive-input-provider.js
          node --check scripts/test-verb-explorer-adaptive-bootstrap.js
          node --check scripts/test-verb-explorer-learner-event.js
          node --check scripts/test-verb-explorer-learner-event-agency.js
          node --check scripts/test-verb-explorer-adaptive-controller.js
          node --check scripts/test-verb-explorer-adaptive-input-provider.js
          node --check scripts/test-verb-explorer-choice-adaptive-integration.js
      - name: Test browser bootstrap
        run: node scripts/test-verb-explorer-adaptive-bootstrap.js
      - name: Test learner event boundary
        run: node scripts/test-verb-explorer-learner-event.js
      - name: Test learner event agency semantics
        run: node scripts/test-verb-explorer-learner-event-agency.js
      - name: Test adaptive controller
        run: node scripts/test-verb-explorer-adaptive-controller.js
      - name: Test adaptive input provider
        run: node scripts/test-verb-explorer-adaptive-input-provider.js
      - name: Test choice adaptive integration
        run: node scripts/test-verb-explorer-choice-adaptive-integration.js
