name: JAGUAR H14.40 reuse V30 85C durable idempotence
on:
  push:
    branches: [jaguar/h14-40-why-v30-85c-durable-idempotency-contract]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-existing-durable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-40-durable-idempotency-audit.js
          node scripts/test-jaguar-h14-39-shadow-occurrence-idempotence.js
          node --test labs/jaguar-v30-3/test/storage-contract.test.mjs
          python3 labs/jaguar-v30-3/test/durable-storage.sqlite.test.py -v
          node scripts/test-s3-why-canonical-green-cycle.js
      - run: node scripts/jaguar-h14-40-durable-idempotency-audit.js --json > h14-40-idempotency-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: jaguar-h14-40-85c-readiness
          path: h14-40-idempotency-readiness.json
