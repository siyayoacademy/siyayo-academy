name: JAGUAR H14.30 supervised semantic feedback
on:
  push:
    branches: [jaguar/h14-30-supervised-semantic-feedback-protocol]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  review-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-30-supervised-semantic-protocol.js
          node scripts/test-jaguar-h14-29-semantic-risk-audit.js
          node scripts/test-jaguar-h14-28-semantic-contrast-bank.js
          node scripts/test-s3-why-canonical-green-cycle.js
      - run: node scripts/jaguar-h14-30-supervised-semantic-protocol.js --json > h14-30-supervised-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: jaguar-h14-30-supervised-feedback
          path: h14-30-supervised-review.json
