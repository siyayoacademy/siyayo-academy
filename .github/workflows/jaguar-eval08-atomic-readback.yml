name: JAGUAR EVAL-08 atomic readback lab (NO DEPLOY)
on:
  push:
    branches: [jaguar/eval08-atomic-readback-20261027]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 --version
      - run: node --test scripts/test-eval08-atomic-readback.mjs
      - run: node --test scripts/test-eval08-verified-intake-candidate.mjs
      - run: node scripts/test-s3-why-canonical-green-cycle.js
      - run: node scripts/test-jaguar-why-production-safety-gate.cjs
