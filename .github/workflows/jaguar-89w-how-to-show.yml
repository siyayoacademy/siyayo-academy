name: JAGUAR 89W WHAT WHERE how-to-show
on:
  push:
    branches: [jaguar/verb-explorer-how-to-show-89w]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  what-where-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Canonical and presentation regressions
        run: |
          node --check js/verb-explorer-what-assessment-live.js
          node --check js/verb-explorer-where-assessment-live.js
          node scripts/test-s1-what-canonical-green-cycle.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-verb-explorer-learner-trail-surface.js
          node scripts/test-elo7d1-polyglot-word-path-view.js
          node scripts/test-elo7d2-word-path-evidence-detail.js
      - name: Start disposable local browser
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/89w-server.log" 2>&1 &
          sleep 3
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: Native browser WHAT WHERE speech and Trail/Word Path retention
        run: python scripts/experimental-89w-what-where-how-to-show.py
      - name: Preserve visuals and strict report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-89w-what-where-real-ui
          path: visual-audit-89w/
          retention-days: 14
          if-no-files-found: warn
