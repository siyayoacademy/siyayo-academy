name: JAGUAR H14.22 centered FUNC-13 browser QA
on:
  push:
    branches: [jaguar/h14-22-func13-centered-browser-speech-qa]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium-centered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-21-centered-toro.js
          node scripts/test-jaguar-h14-20-corpus-speech-card.js
          node scripts/test-jaguar-h14-18-function-window.js
          node scripts/test-jaguar-h14-15-func13-unified.js
          node scripts/test-s3-why-canonical-green-cycle.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-jaguar-h14-22-centered-browser-speech.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jaguar-h14-22-centered-device-captures
          path: artifacts/h14-22/
          if-no-files-found: warn
