name: JAGUAR GEAR360 S2 contextual HOW TO SHOW
on:
  push:
    branches: [jaguar/gear360-s2-contextual-lines-20261114, main]
    paths:
      - 'data/learning/experience-seeds.json'
      - 'js/verb-explorer.js'
      - 'scripts/test-jaguar-gear360-s2-contextual-lines.cjs'
      - 'scripts/jaguar-gear360-s2-contextual-lines-browser.cjs'
      - '.github/workflows/jaguar-gear360-s2-contextual-lines.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s2-contextual-free-study:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing GEAR360 structural integrity
        run: node scripts/jaguar-gear360-house-integrity.cjs
      - name: SEEK TORO cross-map
        run: node scripts/jaguar-gear360-seek-toro-crossmap.cjs
      - name: WHY assessment unchanged
        run: node scripts/test-s3-why-canonical-green-cycle.js
      - name: Verify source-grounded free study scope
        run: node scripts/test-jaguar-gear360-s2-contextual-lines.cjs
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Chromium S2 3 QWs x 3 languages with speaker and Trail
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/siyayo-s2-lines.log 2>&1 &
          node scripts/jaguar-gear360-s2-contextual-lines-browser.cjs
