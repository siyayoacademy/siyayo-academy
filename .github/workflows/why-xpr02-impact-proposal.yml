name: WHY XPR-02 impact proposal
on:
  push:
    branches: [jaguar/why-xpr02-impact-proposal-20261025]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate-documentary-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/validate-siyayo-cross-project-registry.mjs
          node scripts/test-siyayo-xpr02-drift-audit.cjs
          node scripts/validate-why-xpr02-impact-proposal.cjs
