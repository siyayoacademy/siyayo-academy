    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-2-opportunity-map.js
          node scripts/jaguar-90c7h0-supervisor.js
          node scripts/test-s3-why-canonical-green-cycle.js
