name: Corpus Integrity

on:
  push:
    branches:
      - main
      - corpus-integrity-run
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-corpus:
    name: Validate Built-in Actions corpus
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate experience seeds against JSON Schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --strict=true -s data/schemas/experience-seed.schema.json -d data/learning/experience-seeds.json

      - name: Validate College experience seeds against JSON Schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --strict=true -s data/schemas/experience-seed.schema.json -d data/learning/college-experience-seeds.json

      - name: Validate canonical nouns against JSON Schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --strict=true -s data/schemas/noun.schema.json -d data/lexicon/nouns/nouns.json

      - name: Validate canonical adjectives against JSON Schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --strict=true -s data/schemas/adjective.schema.json -d data/lexicon/adjectives/adjectives.json

      - name: Validate SIYAYO archetypes against JSON Schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --strict=true -s data/schemas/archetype.schema.json -d 'data/archetypes/*.json'

      - name: Run SIYAYO archetype semantic validator
        run: node scripts/validate-archetypes.mjs

      - name: Validate SIYAYO palettes against JSON Schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --strict=true -s data/schemas/palette.schema.json -d 'data/palettes/*.json'

      - name: Validate archetype palette references
        run: node scripts/validate-archetype-palettes.mjs

      - name: Compile SIYAYO sound schema
        run: npx --yes ajv-cli@5 compile --spec=draft2020 --strict=true -s data/schemas/sound.schema.json

      - name: Validate Verb Grid against JSON Schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --strict=true -s data/schemas/verb-grid.schema.json -d data/grammar/verb-grid.json

      - name: Run Verb Grid semantic integrity tests
        run: node scripts/test-verb-grid-semantics.js

      - name: Run Xespirito diagnostic engine tests
        run: |
          node --check js/xespirito-diagnostics.js
          node scripts/test-xespirito-diagnostics.js

      - name: Run Xespirito Verb Explorer bridge tests
        run: |
          node --check js/xespirito-explorer-bridge.js
          node scripts/test-xespirito-explorer-bridge.js

      - name: Run Xespirito evidence interpretation tests
        run: |
          node --check js/xespirito-evidence-interpreter.js
          node scripts/test-xespirito-evidence-interpreter.js

      - name: Run Xespirito multilingual interference bridge tests
        run: |
          node --check js/xespirito-interference-bridge.js
          node scripts/test-xespirito-interference-bridge.js

      - name: Run Xespirito PortuSpanGlish evidence tests
        run: node scripts/test-xespirito-portuspanglish.js

      - name: Run conservative interference evidence gate tests
        run: |
          node --check js/xespirito-interference-evidence-gate.js
          node scripts/test-xespirito-interference-evidence-gate.js

      - name: Run adaptive non-punitive evidence profile tests
        run: |
          node --check js/adaptive-evidence-profile.js
          node scripts/test-adaptive-evidence-profile.js

      - name: Run multilingual contrast verification probe tests
        run: |
          node --check js/interference-contrast-verifier.js
          node scripts/test-interference-contrast-verifier.js

      - name: Run verified interference adaptive bridge tests
        run: |
          node --check js/interference-adaptive-bridge.js
          node scripts/test-interference-adaptive-bridge.js

      - name: Run adaptive pedagogical orchestration tests
        run: |
          node --check js/adaptive-pedagogical-orchestrator.js
          node scripts/test-adaptive-pedagogical-orchestrator.js

      - name: Run adaptive experience attempt loop tests
        run: |
          node --check js/adaptive-attempt-loop.js
          node scripts/test-adaptive-attempt-loop.js

      - name: Run closed adaptive learning cycle tests
        run: |
          node --check js/adaptive-learning-cycle.js
          node scripts/test-adaptive-learning-cycle.js

      - name: Run Green Pass learner profile tests
        run: |
          node --check js/green-pass-profile.js
          node scripts/test-green-pass-profile.js

      - name: Run Xespirito Green Pass bridge tests
        run: |
          node --check js/xespirito-green-pass-bridge.js
          node scripts/test-xespirito-green-pass-bridge.js

      - name: Run pedagogical resonance selector tests
        run: |
          node --check js/pedagogical-resonance.js
          node scripts/test-pedagogical-resonance.js

      - name: Run multilingual interference tests
        run: |
          node --check js/multilingual-interference.js
          node scripts/test-multilingual-interference.js

      - name: Run adaptive learning route selector tests
        run: |
          node --check js/adaptive-learning-router.js
          node scripts/test-adaptive-learning-router.js

      - name: Run Nice Party semantic coherence tests
        run: node scripts/test-nice-party-coherence.js

      - name: Run Nice Party accessory and social identity tests
        run: node scripts/test-nice-party-accessories.js

      - name: Run social identity grammar bridge tests
        run: |
          node --check js/social-identity-bridge.js
          node scripts/test-social-identity-bridge.js

      - name: Run SIYAYO Corpus Integrity Validator
        run: node scripts/validate-corpus.js

      - name: Run 3A.3 controlled negative tests
        run: node scripts/test-contextual-choice-negative.js

      - name: Run 3B contextual and canonical resolver tests
        run: node scripts/test-contextual-choice-resolver.js

      - name: Run 3B.2 MENTE PENSANTE UI integration tests
        run: |
          node --check js/contextual-choice-resolver.js
          node --check js/verb-explorer.js
          node scripts/test-choice-ui-integration.js

      - name: Run 3C TENSE MODE safety tests
        run: node scripts/test-experience-grammar-lock.js

      - name: Run 3C.2 independent choice audio tests
        run: node scripts/test-choice-audio.js

      - name: Run 4.1 canonical noun negative tests
        run: node scripts/test-noun-corpus-negative.js

      - name: Run portrait layout containment tests
        run: node scripts/test-portrait-layout.js

      - name: Run 4.2 controlled noun UI tests
        run: |
          node --check js/verb-explorer.js
          node scripts/test-noun-ui-integration.js

      - name: Run 5.1 canonical adjective negative tests
        run: node scripts/test-adjective-corpus-negative.js

      - name: Run 5.2 controlled adjective UI tests
        run: |
          node --check js/verb-explorer.js
          node scripts/test-adjective-ui-integration.js

      - name: Run 6.1 lexical composition UI tests
        run: node scripts/test-lexical-composition-ui.js

      - name: Run 6.2 contextual sentence bridge tests
        run: |
          node --check js/verb-explorer.js
          node scripts/test-contextual-sentence-bridge.js

      - name: Run 6.3 sentence axis navigation tests
        run: node scripts/test-sentence-axis-navigation.js

      - name: Run 6.4 blue verb DNA navigation tests
        run: |
          node --check js/verb-explorer.js
          node scripts/test-blue-verb-navigation.js

      - name: Run 6.5 context-preserving return tests
        run: node scripts/test-context-preserving-return.js

      - name: Run 6.6 repeatable Blue Verb round-trip tests
        run: node scripts/test-blue-verb-round-trip.js

      - name: Run 6.7 ACTION semantic bridge tests
        run: node scripts/test-action-bridge.js

      - name: Run 6.8 toroidal experience handoff tests
        run: node scripts/test-toroidal-experience-handoff.js

      - name: Run 6.10 second toroidal handoff tests
        run: node scripts/test-second-toroidal-handoff.js

      - name: Run 6.12 complete toroidal cycle tests
        run: node scripts/test-complete-toroidal-cycle.js

      - name: Run 6.15 College communication ring tests
        run: node scripts/test-college-toroidal-cycle.js

      - name: Run 6.16 Patita story trace tests
        run: node scripts/test-patita-story-trace.js
