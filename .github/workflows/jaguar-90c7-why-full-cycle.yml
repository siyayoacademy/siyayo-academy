name: JAGUAR 90C.7 WHY all Experiences browser homologation
on:
  push:
    branches: [jaguar/explorer-why-present-acceptance-90c7]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Corpus, assessment and archive gates
        run: |
          test "$(git rev-parse HEAD:labs/jaguar-v30-3)" = "5ee77257551593b8e4960dd6971cc7ed069fcd56"
          node scripts/test-jaguar-why-present-exploration-90c6.js
          node scripts/test-jaguar-contextual-coherence-90c2.js
          node scripts/test-jaguar-retro-coherence-90c3.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-jaguar-lines-authority-90c4.js
          node scripts/test-jaguar-s4-concluding-90c5.js
          node scripts/check-jaguar-90a-manifest.mjs
          node scripts/check-jaguar-90b-roadmap.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Independent offline Chromium server
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/90c7-http.log" 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: Nine paths S1 S2 exploratory, S3 S4 canonical, visual/audio boundaries
        run: python scripts/experimental-90c7-why-full-cycle-browser.py
      - name: Preserve real Chromium captures and failure reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c7-why-full-cycle-browser
          path: visual-audit-90c7-why/
          retention-days: 30
          if-no-files-found: warn
