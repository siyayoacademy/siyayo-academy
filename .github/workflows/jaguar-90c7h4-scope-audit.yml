name: JAGUAR 90C.7H.4 scope and navigation audit
on:
  push:
    branches: [jaguar/explorer-scope-navigation-audit-90c7h4]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node --check js/verb-explorer.js
          node scripts/test-jaguar-90c7h4-s4-no-origin.js
          node scripts/test-jaguar-why-90c7h1-dependency.js
          node scripts/jaguar-90c7h0-supervisor.js
          node scripts/test-s3-why-canonical-green-cycle.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: S4 without WHY S3 must be safe
        run: python scripts/experimental-90c7h4-s4-no-origin.py
      - name: Recheck cross-language S3 owned starts
        run: python scripts/experimental-90c7h3-cross-language-entry.py
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c7h4-scope-audit
          path: |
            visual-audit-90c7h4/
            visual-audit-90c7h3/
          retention-days: 30
