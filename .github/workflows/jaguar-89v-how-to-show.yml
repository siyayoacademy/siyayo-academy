name: JAGUAR 89V HOW TO SHOW integration audit
on:
  push:
    branches: [jaguar/verb-explorer-how-to-show-89v]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax and original canonical regressions
        run: |
          node --check js/verb-explorer-what-assessment-live.js
          node --check js/verb-explorer-where-assessment-live.js
          node --check js/verb-explorer-why-assessment-live.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-s1-what-canonical-green-cycle.js
          node scripts/test-s3-why-longitudinal-transfer.js
          node scripts/test-jaguar-review-after-contextual-feedback.js
      - name: Native browser & speech isolation
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/89v-server.log" 2>&1 &
          sleep 3
          python scripts/experimental-89u-why-how-to-show.py
      - name: Save 89V screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-89v-browser-screenshots
          path: visual-audit-89u/
          retention-days: 14
          if-no-files-found: warn
