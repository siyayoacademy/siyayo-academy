name: JAGUAR 90C HOW TO SHOW Trail Word Path PORTRAIT
on:
  push:
    branches: [jaguar/explorer-how-to-show-90c]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Historical source, 12 BLOCKED staging gates, future map
        run: |
          test "$(git rev-parse HEAD:labs/jaguar-v30-3)" = "5ee77257551593b8e4960dd6971cc7ed069fcd56"
          node scripts/check-jaguar-90a-manifest.mjs
          node scripts/check-jaguar-90b-roadmap.mjs
          node scripts/check-jaguar-90b1-audit.mjs
      - name: Four QW source authorities and observational presentation
        run: |
          node scripts/test-which-third-attempt-green-boundary-90b1.js
          node scripts/test-s1-what-canonical-green-cycle.js
          node scripts/test-s2-what-canonical-green-cycle.js
          node scripts/test-where-live-assessment.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-jaguar-review-after-contextual-feedback.js
          node scripts/test-verb-explorer-live-next-wire.js
          node scripts/test-elo7d1-polyglot-word-path-view.js
          node scripts/test-elo7d2-word-path-evidence-detail.js
          node scripts/test-pronoun-contrast-89z.js
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Real Chromium on disposable localhost, portrait 390x844 only
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/90c-server.log" 2>&1 &
          sleep 3
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: WHAT WHERE WHAT Trail / Word Path read-only
        run: python scripts/experimental-90c-what-where-portrait.py
      - name: WHY S3 S4 Green Pass and Trail/Word Path sync
        run: python scripts/experimental-90c-why-trail-portrait.py
      - name: ES PT CUÁL CUÁLES and QUAL QUAIS free practice
        run: python scripts/experimental-89z-portrait.py
      - name: Keep only portrait evidence, no production or remote storage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c-trail-wordpath-portrait
          path: |
            visual-audit-90c-what-where/
            visual-audit-90c-why/
            visual-audit-89z/
          if-no-files-found: warn
          retention-days: 14
