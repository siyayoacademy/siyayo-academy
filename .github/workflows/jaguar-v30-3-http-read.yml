# CI-only. No deployment, remote D1, production access or real identities.
name: JAGUAR V30.3.87B protected HTTP lab
on:
  push:
    branches:
      - jaguar/v30-3-recovery-archive
    paths:
      - 'labs/jaguar-v30-3/**'
      - '.github/workflows/jaguar-v30-3-http-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: labs/jaguar-v30-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed Access JWT plus read-only HTTP — 20 cases
        run: node --test test/http87/read-only-http.test.mjs
