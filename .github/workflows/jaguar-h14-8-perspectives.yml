jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-7-five-functions-matrix.js
          node scripts/test-jaguar-h14-7-existence-lab.js
          node scripts/test-jaguar-h14-8-perspective-cross-reference.js
          node scripts/test-jaguar-h14-6-why-origin-scoped-contract.js
          node scripts/test-s3-why-canonical-green-cycle.js
