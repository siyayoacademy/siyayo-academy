name: JAGUAR 90C.2 contextual coherence portrait and safety
on:
  push:
    branches: [jaguar/explorer-contextual-coherence-90c2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify historical archive and all 12 blocked release gates
        run: |
          test "$(git rev-parse HEAD:labs/jaguar-v30-3)" = "5ee77257551593b8e4960dd6971cc7ed069fcd56"
          node scripts/check-jaguar-90a-manifest.mjs
          node scripts/check-jaguar-90b-roadmap.mjs
          node scripts/check-jaguar-90b1-audit.mjs
      - name: Reusable corpus coherence validator and all relevant contracts
        run: |
          node --check js/verb-explorer-contextual-coherence.js
          node --check js/verb-explorer.js
          node --check js/verb-explorer-polyglot-word-path-view.js
          node scripts/test-jaguar-contextual-coherence-90c2.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-which-third-attempt-green-boundary-90b1.js
          node scripts/test-s1-what-canonical-green-cycle.js
          node scripts/test-where-live-assessment.js
          node scripts/test-elo7d1-polyglot-word-path-view.js
          node scripts/test-elo7d2-word-path-evidence-detail.js
          node scripts/test-jaguar-review-after-contextual-feedback.js
          node scripts/test-pronoun-contrast-89z.js
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Real Chromium PORTRAIT only — independent local server
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/90c2-http.log" 2>&1 &
          sleep 3
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: LINES S3 S4 EN ES PT and active language Word Path; no false tense
        run: python scripts/experimental-90c2-contextual-portrait.py
      - name: Preserve WHY S3 to S4 2of3 to 3of3 canonical transfer
        run: python scripts/experimental-90c-why-trail-portrait.py
      - name: Keep only portrait snapshots including failure state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c2-contextual-coherence-portrait
          path: |
            visual-audit-90c2-coherence/
            visual-audit-90c-why/
          retention-days: 30
          if-no-files-found: warn
