name: JAGUAR H14.32 pedagogical mediation
on:
  push:
    branches: [jaguar/h14-32-why-pedagogical-mediation]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-32-pedagogical-mediation.js
          node scripts/test-jaguar-h14-31-two-reviewer-consistency.js
          node scripts/test-s3-why-canonical-green-cycle.js
