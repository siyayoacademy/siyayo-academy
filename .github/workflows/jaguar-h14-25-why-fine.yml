name: JAGUAR H14.25 WHY S1 S2 fine coherence
on:
  push:
    branches: [jaguar/h14-25-why-s1-s2-fine-coherence-review]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  why-context-no-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-25-why-s1-s2-fine-review.js
          node scripts/test-jaguar-h14-24-experience-qw-audit.js
          node scripts/test-jaguar-h14-6-why-origin-scoped-contract.js
          node scripts/test-s3-why-canonical-green-cycle.js
      - run: node scripts/jaguar-h14-25-why-s1-s2-fine-review.js --json > h14-25-why-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: jaguar-h14-25-why-s1-s2-reference
          path: h14-25-why-review.json
