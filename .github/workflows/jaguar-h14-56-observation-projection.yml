name: JAGUAR H14.56 read-only observation and assessment projection
on:
  push:
    branches: [jaguar/h14-56-nick-patita-eval-projection-20261026]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  isolated-observation-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent QW/Experience/language read-only projection
        run: node --test labs/jaguar-v30-3/test/h14-56/assessment-observation-bridge.test.cjs
      - name: Existing contract, scope and progress regression
        run: |
          node scripts/test-question-word-assessment-contract.js
          node scripts/test-adaptive-pass-contract-progress-view.js
          node scripts/test-verb-explorer-thinking-mind-assessment-selection.js
          node scripts/test-elo7d1-polyglot-word-path-view.js
          node scripts/test-qword-nick-entry-replay.js
