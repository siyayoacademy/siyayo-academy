name: JAGUAR 90C.7H.1 WHY S1-S2 dependency
on:
  push:
    branches: [jaguar/explorer-why-90c7h1-dependency]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: WHY context dependency and previous authority
        run: |
          node --check js/verb-explorer.js
          node scripts/test-jaguar-why-90c7h1-dependency.js
          node scripts/jaguar-90c7h0-supervisor.js
          node scripts/test-jaguar-why-present-exploration-90c6.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-which-third-attempt-green-boundary-90b1.js
          test "$(git rev-parse HEAD:labs/jaguar-v30-3)" = "5ee77257551593b8e4960dd6971cc7ed069fcd56"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Static browser
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/90c7h1-http.log" 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: Preserve WHICH to WHY EN ES PT
        run: python scripts/experimental-90c7h0-which-to-why-portrait.py
      - name: Save browser results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c7h1-which-to-why
          path: visual-audit-90c7h0-switch/
          retention-days: 30
  visual-full-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Serve statically in local Chrome
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/90c7h1-visual.log" 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: Full S1 S2 S3 S4 WHY DF DHP EN ES PT
        run: python scripts/experimental-90c7h1-why-dependency-visual.py
      - name: Preserve visual verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c7h1-dependency-visual
          path: visual-audit-90c7h1-dependency/
          retention-days: 30
