name: JAGUAR H14.23 Gear Snapshot read-only contract
on:
  push:
    branches: [jaguar/h14-23-func13-real-gear-readonly-integration]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  read-only-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node scripts/test-jaguar-h14-23-gear-snapshot.js
          node scripts/test-jaguar-h14-21-centered-toro.js
          node scripts/test-jaguar-h14-18-function-window.js
          node scripts/test-jaguar-h14-15-func13-unified.js
