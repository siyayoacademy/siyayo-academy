name: JAGUAR 90C.7H.3 cross-language independent entry
on:
  push:
    branches: [jaguar/explorer-cross-language-origin-90c7h3]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: |
          node --check js/verb-explorer-thinking-mind-assessment-selection.js
          node scripts/jaguar-90c7h0-supervisor.js
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-jaguar-why-90c7h1-dependency.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - run: python scripts/experimental-90c7h3-cross-language-entry.py
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jaguar-90c7h3-six-cross-language-paths
          path: visual-audit-90c7h3/
          retention-days: 30
