name: JAGUAR PATITA H13 identity diagnosis
on:
  push:
    branches: [jaguar/patita-identity-h13-control-gate]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/site.log" 2>&1 &
          sleep 3
      - run: python scripts/experimental-patita-h13-diagnostic.py
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: patita-h13-identity-diagnostic
          path: visual-audit-patita-h13/
