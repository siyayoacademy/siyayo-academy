# Isolated WHAT TO SHOW pilot. No production, deploy, privileged credentials or external API.
name: JAGUAR 89U WHY how-to-show isolated
on:
  push:
    branches:
      - jaguar/verb-explorer-how-to-show-89u
  workflow_dispatch:
permissions:
  contents: read
jobs:
  why-how-to-show:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax and canonical S3-S4 WHY regression
        run: |
          node --check js/verb-explorer-why-assessment-live.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-s3-why-canonical-green-cycle.js
      - name: Launch isolated Chrome
        run: |
          python -m pip install playwright==1.56.0
          which google-chrome || which google-chrome-stable
          python -m http.server 8879 --bind 127.0.0.1 > "$RUNNER_TEMP/89u-server.log" 2>&1 &
          sleep 3
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8879/verb-explorer.html
      - name: Native browser HOW TO SHOW & audio isolation 9 cases
        run: python scripts/experimental-89u-why-how-to-show.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: jaguar-89u-why-how-to-show-visual
          path: visual-audit-89u/
          if-no-files-found: warn
          retention-days: 14
