# JAGUAR 90A: merged source-tree provenance and local cross-lineage contracts.
# NO Cloudflare, no D1 bindings, no deployment, no real sessions.
name: JAGUAR 90A cross-lineage preservation and integration gate
on:
  push:
    branches: [jaguar/explorer-integration-gate-90a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify exact archived lab tree and external release gates
        run: |
          actual=$(git rev-parse HEAD:labs/jaguar-v30-3)
          test "$actual" = "5ee77257551593b8e4960dd6971cc7ed069fcd56"
          node scripts/check-jaguar-90a-manifest.mjs
      - name: Preserve original V30 local worker/mock contracts
        working-directory: labs/jaguar-v30-3
        run: |
          node --test test/worker.test.mjs test/identity-mock/identity.test.mjs test/bridge.test.mjs
          node --test test/worker-v30-integration.test.mjs
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/checkout@v5
        with:
          repository: siyayoacademy/siyayo-academy
          ref: c7e83709cacf8479847df0f3cee4ed8a563aaae6
          path: .pinned-explorer-90a
      - name: 'Original V30 audit vs frozen Explorer: 89O/P/Q/R'
        working-directory: labs/jaguar-v30-3
        env:
          SIYAYO_89O_PINNED_ROOT: ../../.pinned-explorer-90a
          SIYAYO_89P_PINNED_ROOT: ../../.pinned-explorer-90a
          SIYAYO_89Q_PINNED_ROOT: ../../.pinned-explorer-90a
          SIYAYO_89R_PINNED_ROOT: ../../.pinned-explorer-90a
        run: |
          node --test test/review-why-transversal-89o.test.mjs
          node --test test/which-evidence-boundary-89p.test.mjs
          node --test test/scoped-memory-continuity-89q.test.mjs
          node --test test/scoped-selection-word-path-89r.test.mjs
      - name: Current 89Z integrated Explorer assessment and free practice
        run: |
          node scripts/test-s3-why-canonical-green-cycle.js
          node scripts/test-s3-why-live-assessment.js
          node scripts/test-s1-what-canonical-green-cycle.js
          node scripts/test-where-location-pass-contract.js
          node scripts/test-jaguar-review-after-contextual-feedback.js
          node scripts/test-elo7d1-polyglot-word-path-view.js
          node scripts/test-elo7d2-word-path-evidence-detail.js
          node scripts/test-cual-cuales-extension.js
          node scripts/test-pronoun-contrast-89z.js
